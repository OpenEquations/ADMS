spring.application.name=adms

spring.datasource.url=jdbc:postgresql://localhost:5432/adms
spring.datasource.username=adms
spring.datasource.password=adms_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.jpa.packages-to-scan=rw.adms.infrastructure.persistence.entities